<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pulsar trainer</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d; --fg: #e6edf3;
    --dim: #8b949e; --green: #3fb950; --red: #f85149; --yellow: #d29922;
    --blue: #58a6ff; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 -apple-system, system-ui, sans-serif; padding: 12px; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  h1 .host { color: var(--dim); font-weight: normal; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 10px; padding: 12px 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--dim); margin: 0 0 8px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; margin: 3px 0;
        font-size: 14px; }
  .kv .k { color: var(--dim); flex-shrink: 0; }
  .kv .v { text-align: right; overflow-wrap: anywhere; font-family: var(--mono); font-size: 13px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
         margin-right: 6px; vertical-align: baseline; }
  .on  { background: var(--green); } .off { background: var(--red); }
  .warn { color: var(--yellow); } .bad { color: var(--red); } .good { color: var(--green); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  button { background: #21262d; color: var(--fg); border: 1px solid var(--border);
           border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
  button:active { background: #30363d; }
  button.danger { border-color: #6e2c2f; color: #ff7b72; }
  button.primary { border-color: #1f6feb; color: var(--blue); }
  button:disabled { opacity: .45; }
  pre { background: #010409; border: 1px solid var(--border); border-radius: 10px;
        padding: 10px; font-family: var(--mono); font-size: 12px; overflow-x: auto;
        white-space: pre-wrap; word-break: break-all; max-height: 45vh; overflow-y: auto; }
  #jobcard { display: none; }
  a { color: var(--blue); text-decoration: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--dim); font-size: 12px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
           background: #21262d; border: 1px solid var(--border); padding: 10px 16px;
           border-radius: 10px; display: none; max-width: 90vw; z-index: 10; }
  details { margin-top: 12px; }
  summary { color: var(--dim); cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<h1>pulsar trainer <span class="host" id="host"></span></h1>

<div class="grid">
  <div class="card">
    <h2>Trainer</h2>
    <div class="kv"><span class="k">state</span><span class="v" id="t-state">…</span></div>
    <div class="kv"><span class="k">since</span><span class="v" id="t-since">–</span></div>
    <div class="kv"><span class="k">log written</span><span class="v" id="t-logage">–</span></div>
    <div class="kv"><span class="k">last line</span><span class="v" id="t-lastline" style="font-size:11px">–</span></div>
  </div>
  <div class="card">
    <h2>Progress</h2>
    <div class="kv"><span class="k">steps</span><span class="v" id="c-steps">–</span></div>
    <div class="kv"><span class="k">checkpoint age</span><span class="v" id="c-age">–</span></div>
    <div class="kv"><span class="k">checkpoints</span><span class="v" id="c-count">–</span></div>
    <div class="kv"><span class="k">metrics</span><span class="v" id="c-wandb">–</span></div>
  </div>
  <div class="card">
    <h2>GPU</h2>
    <div class="kv"><span class="k">util</span><span class="v" id="g-util">–</span></div>
    <div class="kv"><span class="k">vram</span><span class="v" id="g-mem">–</span></div>
    <div class="kv"><span class="k">temp / power</span><span class="v" id="g-temp">–</span></div>
    <div class="kv"><span class="k">disk free</span><span class="v" id="g-disk">–</span></div>
  </div>
  <div class="card">
    <h2>Code</h2>
    <div class="kv"><span class="k">branch</span><span class="v" id="git-branch">–</span></div>
    <div class="kv"><span class="k">head</span><span class="v" id="git-head">–</span></div>
    <div class="kv"><span class="k">vs origin</span><span class="v" id="git-sync">–</span></div>
    <div class="kv"><span class="k">visualizer</span><span class="v" id="viz-state">–</span></div>
  </div>
</div>

<div class="actions">
  <button data-action="start"  class="primary">▶ Start</button>
  <button data-action="stop"   class="danger">■ Stop</button>
  <button data-action="restart" class="danger">↻ Restart</button>
  <button data-action="check_updates">Check updates</button>
  <button data-action="update" class="primary">⬆ Update (pull+build+restart)</button>
  <button data-action="build">Build only</button>
  <button data-action="viz_start">Viz on</button>
  <button data-action="viz_stop">Viz off</button>
  <button data-action="dashboard_restart">↻ Dashboard</button>
  <a id="vizlink" href="#" target="_blank"><button type="button" class="primary">👁 Visualizer ↗</button></a>
</div>

<div class="card" id="jobcard">
  <div class="row"><h2 id="jobtitle">Job</h2><span class="muted" id="jobstate"></span></div>
  <pre id="jobout"></pre>
</div>

<div class="card">
  <div class="row">
    <h2>Live log</h2>
    <span><button id="logbtn">▶ stream</button></span>
  </div>
  <pre id="logout">(press stream)</pre>
</div>

<details>
  <summary>Recent actions (audit)</summary>
  <pre id="audit"></pre>
</details>
<div class="muted" id="updated" style="margin-top:8px"></div>
<div id="toast"></div>

<script>
"use strict";
let PIN = null;

const $ = id => document.getElementById(id);
function toast(msg, ms = 3500) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms);
}
function ago(secs) {
  if (secs == null) return "–";
  if (secs < 90) return secs + "s ago";
  if (secs < 5400) return Math.round(secs / 60) + "m ago";
  return (secs / 3600).toFixed(1) + "h ago";
}
function fmtSteps(n) {
  if (n == null) return "–";
  return n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : (n / 1e6).toFixed(1) + "M";
}

async function refresh() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("host").textContent = "@ " + s.host;
    const tr = s.trainer;
    $("t-state").innerHTML = tr.running
      ? '<span class="dot on"></span>running'
      : '<span class="dot off"></span>stopped';
    $("t-since").textContent = tr.since || (tr.pid ? "pid " + tr.pid : "–");
    const la = s.log.age_secs;
    $("t-logage").textContent = ago(la);
    $("t-logage").className = "v " + (la == null ? "" : la > 600 ? "bad" : la > 120 ? "warn" : "good");
    $("t-lastline").textContent = s.log.last_line || "–";
    $("c-steps").textContent = fmtSteps(s.checkpoint.steps);
    $("c-age").textContent = ago(s.checkpoint.age_secs);
    $("c-count").textContent = s.checkpoint.count;
    $("c-wandb").innerHTML = s.wandb_url
      ? `<a href="${s.wandb_url}" target="_blank">wandb ↗</a>` : "wandb";
    if (s.gpu) {
      $("g-util").textContent = s.gpu.util;
      $("g-mem").textContent = s.gpu.mem_used + " / " + s.gpu.mem_total;
      $("g-temp").textContent = s.gpu.temp + "°C / " + s.gpu.power;
    }
    $("g-disk").textContent = s.disk.free_gb + " / " + s.disk.total_gb + " GB";
    $("git-branch").textContent = s.git.branch + (s.git.dirty ? " (dirty!)" : "");
    $("git-head").textContent = s.git.head;
    const behind = s.git.behind, aheadN = s.git.ahead;
    let sync = [];
    if (behind) sync.push(`<span class="warn">${behind} behind</span>`);
    if (aheadN) sync.push(`${aheadN} ahead`);
    $("git-sync").innerHTML = sync.length ? sync.join(", ") : '<span class="good">in sync</span>';
    const viz = s.viz.web && s.viz.render;
    const vizUrl = location.protocol === "https:"
      ? `https://${location.hostname}:8443/visualizer/visualizer.html`
      : "http://localhost:9275/visualizer/visualizer.html";
    const vizLabel = viz ? "on" : (s.viz.web || s.viz.render ? "partial" : "off");
    $("viz-state").innerHTML =
      `<span class="dot ${viz ? "on" : "off"}"></span>` +
      `<a href="${vizUrl}" target="_blank">open ↗</a> <span class="muted">(${vizLabel})</span>`;
    $("vizlink").href = vizUrl;
    $("updated").textContent = "updated " + s.time
      + (s.locked_out_secs ? ` — PIN LOCKED ${s.locked_out_secs}s` : "");
  } catch (e) {
    $("updated").textContent = "status fetch failed: " + e;
  }
}

async function act(action) {
  if (["stop", "restart", "update", "dashboard_restart"].includes(action)
      && !confirm(action.replace("_", " ") + " — sure?")) return;
  if (!PIN) {
    PIN = prompt("Action PIN:");
    if (!PIN) return;
  }
  let resp, body;
  try {
    resp = await fetch("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, pin: PIN }),
    });
    body = await resp.json();
  } catch (e) { toast("request failed: " + e); return; }
  if (!resp.ok) {
    if (resp.status === 403) PIN = null;
    toast(body.error || "failed");
    return;
  }
  followJob(body.job, action);
}

let jobES = null;
function followJob(id, action) {
  if (jobES) jobES.close();
  $("jobcard").style.display = "block";
  $("jobtitle").textContent = "Job: " + action;
  $("jobstate").textContent = "running…";
  const out = $("jobout"); out.textContent = "";
  jobES = new EventSource(`/api/job/${id}/stream`);
  jobES.onmessage = ev => {
    if (ev.data.startsWith("__DONE__")) {
      const rc = ev.data.split("rc=")[1];
      $("jobstate").textContent = rc === "0" ? "done ✓" : "FAILED (rc " + rc + ")";
      jobES.close(); jobES = null;
      refresh();
      return;
    }
    out.textContent += ev.data + "\n";
    out.scrollTop = out.scrollHeight;
  };
  jobES.onerror = () => { $("jobstate").textContent = "stream lost"; };
}

let logES = null;
$("logbtn").onclick = () => {
  if (logES) {
    logES.close(); logES = null;
    $("logbtn").textContent = "▶ stream";
    return;
  }
  const out = $("logout"); out.textContent = "";
  logES = new EventSource("/api/logs/stream");
  logES.onmessage = ev => {
    out.textContent += ev.data + "\n";
    if (out.textContent.length > 400000)
      out.textContent = out.textContent.slice(-300000);
    out.scrollTop = out.scrollHeight;
  };
  logES.onerror = () => toast("log stream lost; tap stream to reconnect");
  $("logbtn").textContent = "■ pause";
};

async function loadAudit() {
  try {
    const a = await (await fetch("/api/audit")).json();
    $("audit").textContent = a.entries.map(e =>
      `${e.time}  ${e.ok ? " ok " : "DENY"}  ${e.action}  ${e.who}${e.detail ? "  (" + e.detail + ")" : ""}`
    ).reverse().join("\n") || "(none)";
  } catch (e) {}
}
document.querySelector("details").addEventListener("toggle", loadAudit);

document.querySelectorAll("button[data-action]").forEach(b =>
  b.onclick = () => act(b.dataset.action));

// A hidden tab keeps its SSE streams open while the browser freezes the page,
// so data piles up until the renderer dies (white tab). Pause streams while
// hidden; resume whatever was streaming when the tab wakes.
let resumeLog = false;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (logES) { resumeLog = true; $("logbtn").onclick(); }   // close stream
    if (jobES) { jobES.close(); jobES = null; $("jobstate").textContent = "paused (tab hidden)"; }
  } else {
    refresh();
    if (resumeLog) { resumeLog = false; $("logbtn").onclick(); } // reopen stream
  }
});

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
