[package]
name = "rocketsim"
version.workspace = true
edition = "2024"
license-file.workspace = true

[dependencies]
arrayvec = "0.7.6"
byteorder = "1.5.0"
derive_hash_fast = "0.2.3"
fastrand = "2.3.0"
fern = "0.7.1"
glam.workspace = true
include_dir = "0.7.4"
log = "0.4.29"
rocketsim_derive = { path = "../rocketsim_derive" }
rustc-hash.workspace = true
zerocopy = { version = "0.8.34", features = ["derive"] }
indexmap = "2.14.0"

[dev-dependencies]
clap = { version = "4.6.0", features = ["derive"] }

[target.'cfg(not(any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
# Portable SIMD on ppc64le (VSX). Was `optional = true` with no feature wiring
# it on, so generic scalar glam was used on CCNI POWER9.
glam = { workspace = true, features = ["core-simd"] }

[lints.clippy]
all = "warn"
# nursery = "warn"
# pedantic = "warn"
